name: Atualização diária do acervo

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 11 * * *"   # 08:17 (Brasília) — varredura da manhã
    - cron: "17 23 * * *"   # 20:17 (Brasília) — varredura da noite, fecha o dia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-acervo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coleta de dados oficiais (Câmara dos Deputados)
        run: python3 scripts/coletar_camara.py

      - name: Clipping diário — monitora menções a Walter Ihoshi e regenera o site
        run: |
          python3 scripts/monitorar_expandido.py
          python3 scripts/gerar.py
          python3 scripts/clipping_status.py
          python3 scripts/clipping_revisar.py
          python3 scripts/inline_css.py

      - name: Publica dados atualizados (clipping e fila de validação)
        run: |
          git config user.name "acervo-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Clipping/monitoramento diário: coleta e regeração ($(date -u +%F))"
          git push

      - name: Verificação de UX e acessibilidade (bloqueia publicação quebrada)
        run: python3 scripts/testar_ux.py

      - name: Publica o site (branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          commit_message: "Site atualizado (${{ github.run_number }})"
